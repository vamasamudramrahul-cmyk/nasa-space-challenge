<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Space — Animated Universe</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#02030a;font-family:Arial,sans-serif}
.universe{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#101126 0%,#070916 35%,#03040c 70%,#010208 100%)}
.nebula{position:absolute;width:85vw;height:85vw;max-width:900px;max-height:900px;border-radius:50%;filter:blur(75px);opacity:.18;animation:nebulaMove 24s ease-in-out infinite alternate}
.nebula-one{top:10%;left:-30%;background:radial-gradient(circle,#3526a6 0%,#17165b 35%,transparent 70%)}
.nebula-two{right:-35%;bottom:0;background:radial-gradient(circle,#153e87 0%,#25114c 40%,transparent 70%);animation-delay:-12s}
.nebula-three{top:35%;left:25%;width:50vw;height:50vw;background:radial-gradient(circle,#442066 0%,#161139 40%,transparent 70%);opacity:.12;animation-duration:32s}
#stars,.distant-stars,.atmosphere{position:absolute;inset:0;width:100%;height:100%}
.distant-stars{z-index:1;background-image:radial-gradient(1px 1px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 60%,#a9caff,transparent),radial-gradient(1px 1px at 70% 30%,#fff,transparent),radial-gradient(1px 1px at 80% 80%,#fff,transparent),radial-gradient(1px 1px at 45% 15%,#d5dfff,transparent),radial-gradient(1px 1px at 15% 85%,#fff,transparent),radial-gradient(1px 1px at 90% 50%,#b8caff,transparent),radial-gradient(1px 1px at 55% 75%,#fff,transparent);background-size:270px 300px;opacity:.65;animation:distantDrift 100s linear infinite}
#stars{z-index:2}
.atmosphere{z-index:3;pointer-events:none;background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,8,.25) 65%,rgba(0,0,0,.7) 100%)}
.shooting-star{position:absolute;z-index:4;top:20%;left:-20%;width:140px;height:1px;opacity:0;background:linear-gradient(90deg,transparent,#9fcaff,#fff);transform:rotate(-25deg);animation:shooting 8s linear 3s infinite;box-shadow:0 0 8px #80aaff}
.shooting-star.two{top:55%;width:100px;animation-duration:10s;animation-delay:11s}
.center-content{position:absolute;z-index:5;top:50%;left:50%;width:90%;transform:translate(-50%,-50%);text-align:center;color:#fff;pointer-events:none}
.center-content h1{font-size:clamp(24px,5vw,52px);font-weight:300;letter-spacing:.18em;text-shadow:0 0 25px rgba(125,160,255,.4);animation:titleGlow 5s ease-in-out infinite alternate}
.center-content p{margin-top:16px;color:#a6b2d1;font-size:11px;letter-spacing:.35em;text-transform:uppercase}
@keyframes nebulaMove{from{transform:translate(-3%,-2%) scale(.95)}to{transform:translate(5%,4%) scale(1.12)}}
@keyframes distantDrift{to{transform:translateY(-300px)}}
@keyframes shooting{0%,75%{left:-20%;opacity:0}77%{opacity:.9}90%,100%{left:120%;opacity:0}}
@keyframes titleGlow{from{text-shadow:0 0 12px rgba(125,160,255,.2)}to{text-shadow:0 0 35px rgba(125,160,255,.7)}}
@media(max-width:600px){.nebula{filter:blur(55px)}.center-content p{font-size:9px;letter-spacing:.2em}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="universe">
  <div class="nebula nebula-one"></div>
  <div class="nebula nebula-two"></div>
  <div class="nebula nebula-three"></div>
  <div class="distant-stars"></div>
  <canvas id="stars"></canvas>
  <div class="shooting-star"></div>
  <div class="shooting-star two"></div>
  <div class="atmosphere"></div>
</main>
<script>
const canvas=document.getElementById("stars"),ctx=canvas.getContext("2d");
let stars=[],width=0,height=0;
function resizeCanvas(){
  width=innerWidth;height=innerHeight;
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=width*dpr;canvas.height=height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  createStars();
}
function createStars(){
  stars=Array.from({length:Math.min(450,Math.floor(width*height/1800))},()=>({
    x:Math.random()*width,y:Math.random()*height,
    radius:Math.random()*1.4+.2,alpha:Math.random()*.8+.2,
    speed:Math.random()*.012+.003,phase:Math.random()*Math.PI*2,
    drift:Math.random()*.12+.02
  }));
}
function drawStars(){
  ctx.clearRect(0,0,width,height);
  const time=performance.now()*.001;
  for(const s of stars){
    const twinkle=.35+.65*(Math.sin(time*s.speed*60+s.phase)+1)/2;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.radius,0,Math.PI*2);
    ctx.fillStyle=`rgba(220,232,255,${s.alpha*twinkle})`;
    ctx.fill();
    if((s.y+=s.drift)>height){s.y=0;s.x=Math.random()*width}
  }
  requestAnimationFrame(drawStars);
}
addEventListener("resize",resizeCanvas);
resizeCanvas();
drawStars();
</script>
</body>
</html>
